<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电子社小游戏厅</title>
<style>
  :root{--pink:#FF9AA0;--pinkbg:#FFE4E1;--teal:#7DCEC8;--blue:#A2BCF6;--ink:#4A4A4A;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:"Microsoft YaHei","微软雅黑",sans-serif;background:linear-gradient(135deg,var(--pinkbg) 0%,#FFF6F0 60%,#EAF7F5 100%);color:var(--ink);min-height:100vh;display:flex;justify-content:center;}
  #app{width:100%;max-width:720px;padding:18px 16px 40px;}
  header{text-align:center;padding:14px 0 4px;}
  header h1{font-size:28px;letter-spacing:3px;}
  header h1 .dot{color:var(--pink);}
  header p{font-size:13px;color:#9a8f8f;margin-top:6px;}
  .card{background:#fff;border-radius:18px;box-shadow:0 6px 22px rgba(255,154,160,.18);padding:16px;margin-top:14px;}
  a.gbtn{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);padding:14px 12px;border-radius:16px;background:linear-gradient(135deg,#FFFDFB,#FFF3F0);border:2px solid #FFF0EE;margin-top:10px;transition:all .15s;}
  a.gbtn:hover{border-color:var(--pink);transform:translateY(-1px);}
  a.gbtn .ico{font-size:32px;flex:none;width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.06);}
  a.gbtn .tx{flex:1;min-width:0;}
  a.gbtn .tx b{display:block;font-size:17px;}
  a.gbtn .tx small{display:block;font-size:12px;color:#9a8f8f;margin-top:3px;line-height:1.5;}
  a.gbtn .tx em{display:block;font-style:normal;font-size:11px;color:#3CBF8E;margin-top:4px;}
  a.gbtn .go{flex:none;font-size:22px;color:var(--pink);font-weight:bold;}
  .tip{margin-top:14px;font-size:12px;color:#7d7070;line-height:1.8;text-align:center;}
  .foot{margin-top:18px;text-align:center;font-size:11px;color:#b8a9a9;line-height:1.8;}
  .foot a{color:#b8878d;text-decoration:none;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>电子社<span class="dot">小游戏厅</span> 🎮</h1>
    <p>电子制作社团 · 课堂配套小游戏 · 手机电脑都能玩</p>
  </header>

  <div class="card">
    <a class="gbtn" href="yuanjian.html">
      <span class="ico">🔍</span>
      <span class="tx"><b>元件识别大作战</b><small>看图 / 听描述认元件 + 色环读数挑战（10+8 题）</small><em id="b1"></em></span>
      <span class="go">→</span>
    </a>
    <a class="gbtn" href="fanyi.html">
      <span class="ico">🃏</span>
      <span class="tx"><b>符号翻牌配对</b><small>原理图符号 ↔ 元件名，翻牌记忆配对，3 个难度</small><em id="b2"></em></span>
      <span class="go">→</span>
    </a>
    <a class="gbtn" href="hanjie.html">
      <span class="ico">🔧</span>
      <span class="tx"><b>流程排序挑战</b><small>焊接五步法、通电前检查、故障排查，按正确顺序点选</small><em id="b3"></em></span>
      <span class="go">→</span>
    </a>
    <a class="gbtn" href="wanyongbiao.html">
      <span class="ico">🎛️</span>
      <span class="tx"><b>万用表快答</b><small>12 个测量场景选对档位，档位错一步，仪表伤一路</small><em id="b4"></em></span>
      <span class="go">→</span>
    </a>
    <a class="gbtn" href="anquan.html">
      <span class="ico">🚦</span>
      <span class="tx"><b>安全红绿灯</b><small>快速判断操作是安全还是危险，3 条命，越答越快</small><em id="b5"></em></span>
      <span class="go">→</span>
    </a>
  </div>

  <div class="tip">⌨️ 部分游戏支持数字键 1–4 快速作答<br>🏆 各游戏的最佳成绩会自动保存在本机</div>

  <div class="foot">电子社 2026 学年 · 动手拆一块板，比看十张图更有用<br><a href="https://github.com/hao051026/dianzi-yuanjian-youxi" target="_blank">GitHub 仓库</a></div>
</div>
<script>
"use strict";
function ls(k){try{return JSON.parse(localStorage.getItem(k)||"null");}catch(e){return null;}}
function num(k){try{var v=localStorage.getItem(k);return v===null?null:parseInt(v,10);}catch(e){return null;}}
document.getElementById("b1").textContent="三大模式 · 离线可玩";
var fb=null,fl="";
[4,6,8].forEach(function(n){
  var b=ls("fanyi_best_"+n);
  if(b&&(!fb||b.m<fb.m)){fb=b;fl=n+" 对";}
});
document.getElementById("b2").textContent=fb?("🏆 最佳："+fl+" · "+fb.m+" 步 / "+fb.t+" 秒"):"暂无纪录，来挑战";
var hb=ls("hanjie_best");
document.getElementById("b3").textContent=hb?("🏆 最佳：错 "+hb.e+" 次 · "+hb.t+" 秒"):"暂无纪录，来挑战";
var wb=num("wan_best");
document.getElementById("b4").textContent=wb!==null?("🏆 最高分 "+wb):"暂无纪录，来挑战";
var ab=num("anquan_best");
document.getElementById("b5").textContent=ab!==null?("🏆 最高分 "+ab):"暂无纪录，来挑战";
</script>
</body>
</html>
